[package]
name = "narrative-sprout"
version = "2.0.0"
description = "An AI-powered interactive visual novel that runs entirely in your browser."
authors = []
license = "MIT"
repository = "https://github.com/bxx81/Narrative-Sprout"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-window-state = "2.4.0"
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-cors-fetch = "5.0.0"

# Phase 7.3: tauri-plugin-stronghold (credentials Vault) + keyring
# (Vault unlock password storage) will be added here.
