name: tauri-release

on:
  release:
    types: [published]
  # Retry/recovery path: run the same build against any existing release tag
  # (e.g. when a run failed or a release shipped without its installer).
  # The input field takes the bare tag name only — "release_tag=..." is
  # rejected by the first step.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag name only, e.g. narrative-sprout-v2.1.0
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      # Runs before checkout so a mistyped tag fails fast with an actionable
      # message instead of a checkout refspec error. Also resolves the upload
      # target here (works for both triggers: the release event carries the
      # release id, a dispatch only knows the tag) and deletes stale installer
      # assets so a re-run replaces instead of failing on a duplicate name.
      - name: Resolve the release to upload to
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            *=*)
              echo "::error::Invalid tag '$RELEASE_TAG' — enter the tag name only (e.g. narrative-sprout-v2.1.0), not 'release_tag=...'"
              exit 1
              ;;
          esac
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
            echo "::error::Invalid tag '$RELEASE_TAG' — expected a name like narrative-sprout-v2.1.0"
            exit 1
          fi
          release_id=$(gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" --jq .id)
          if [ -z "$release_id" ]; then
            echo "::error::No GitHub release found for tag $RELEASE_TAG"
            exit 1
          fi
          echo "Resolved release $release_id for tag $RELEASE_TAG"
          gh api "repos/${{ github.repository }}/releases/$release_id" --jq '.assets[] | "\(.id) \(.name)"' |
            while read -r asset_id asset_name; do
              case "$asset_name" in
                *-setup.exe | *.msi)
                  echo "Removing existing asset $asset_name"
                  gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$asset_id" > /dev/null
                  ;;
              esac
            done
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@v2

      # The desktop build embeds the Google Drive OAuth values at build time.
      # `.env.tauri` is gitignored (Vite loads it automatically for
      # `--mode tauri`), so the CI values come from repository Actions secrets
      # and are written to the runner workspace only — never to git.
      - name: Write .env.tauri from repository secrets
        shell: bash
        env:
          VITE_GOOGLE_CLIENT_ID_TAURI: ${{ secrets.VITE_GOOGLE_CLIENT_ID_TAURI }}
          VITE_GOOGLE_CLIENT_SECRET_TAURI: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET_TAURI }}
        run: |
          set -euo pipefail
          if [ -z "$VITE_GOOGLE_CLIENT_ID_TAURI" ] || [ -z "$VITE_GOOGLE_CLIENT_SECRET_TAURI" ]; then
            echo "::error::Add VITE_GOOGLE_CLIENT_ID_TAURI and VITE_GOOGLE_CLIENT_SECRET_TAURI as repository Actions secrets (README > Google Drive setup > Desktop app variant)"
            exit 1
          fi
          printf 'VITE_GOOGLE_CLIENT_ID_TAURI=%s\nVITE_GOOGLE_CLIENT_SECRET_TAURI=%s\n' \
            "$VITE_GOOGLE_CLIENT_ID_TAURI" "$VITE_GOOGLE_CLIENT_SECRET_TAURI" > .env.tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauriScript resolves to `bun run tauri build`, which runs
      # sync:tauri-version first — the same command as a local release build.
      # RELEASE_ID (resolved above) points the upload at the release tied to
      # RELEASE_TAG, so no manual asset upload is needed.
      - name: Build and upload the installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ env.RELEASE_ID }}
          tauriScript: bun run tauri
          uploadUpdaterJson: false

      # cargo owns the narrative-sprout version line in Cargo.lock: it rewrites
      # the file on every run and drops comments, so release-please cannot
      # bump it and a local build after the release-PR merge would otherwise
      # leave the tree dirty. This build already regenerated the lock, so it
      # is committed back to main. Idempotent and skip-safe: nothing is pushed
      # when main is already ahead of the release commit (an earlier run's
      # back-commit, or dependencies merged in the meantime that must not be
      # rolled back).
      - name: Commit the refreshed Cargo.lock back to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$MAIN_SHA" != "$(git rev-parse HEAD)" ] && git merge-base --is-ancestor HEAD "$MAIN_SHA"; then
            echo "::notice::main is ahead of the release commit; skipping the Cargo.lock refresh"
            exit 0
          fi
          if git diff --quiet origin/main -- src-tauri/Cargo.lock; then
            echo "::notice::main already carries this Cargo.lock; nothing to refresh"
            exit 0
          fi
          git add src-tauri/Cargo.lock
          git commit -m "chore: refresh Cargo.lock for $RELEASE_TAG"
          if ! git push origin HEAD:main; then
            echo "::error::Cargo.lock refresh push was rejected — re-run this workflow"
            exit 1
          fi
